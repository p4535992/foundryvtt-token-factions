<div class="form-group">
    <label>{{localize "token-factions.tokeconfig.enableBorder"}}</label>
    <div class="form-fields">
        <input
            type="checkbox"
            data-edit="flags.token-factions.enableBorder"
            name="flags.token-factions.enableBorder"
            data-dtype="Boolean"
            value="{{enableBorder}}"
            {{checked
            enableBorder}}
        />
    </div>
</div>
<div class="form-group">
    <label>{{localize "token-factions.tokeconfig.customBorder"}}</label>
    <div class="form-fields">
        <input
            type="checkbox"
            data-edit="flags.token-factions.customBorder"
            name="flags.token-factions.customBorder"
            data-dtype="Boolean"
            value="{{customBorder}}"
            {{checked
            customBorder}}
        />
    </div>
</div>
<div class="form-group">
    <label>{{localize "token-factions.tokeconfig.customColorInt"}}</label>
    <div class="form-fields">
        <color-picker value="{{customColorInt}}" name="flags.token-factions.customColorInt">
            <input type="text" value="{{customColorInt}}" />
            <input type="color" />
        </color-picker>
    </div>
</div>
<div class="form-group">
    <label>{{localize "token-factions.tokeconfig.customColorExt"}}</label>
    <div class="form-fields">
        <color-picker value="{{customColorExt}}" name="flags.token-factions.customColorExt">
            <input type="text" value="{{customColorExt}}" />
            <input type="color" />
        </color-picker>
    </div>
</div>
<div class="form-group">
    <label>{{localize "token-factions.tokeconfig.customFrameOpacity"}}</label>
    <div class="form-fields">
        <range-picker
            name="flags.token-factions.customFrameOpacity"
            value="{{customFrameOpacity}}"
            min="0"
            max="1"
            step="0.01"
        >
            <input type="range" min="0" max="1" step="0.01" />
            <input type="number" min="0" max="1" step="0.01" />
        </range-picker>
    </div>
</div>

<div class="form-group">
    <label>{{localize "token-factions.tokeconfig.customBaseOpacity"}}</label>
    <div class="form-fields">
        <range-picker
            name="flags.token-factions.customBaseOpacity"
            value="{{customBaseOpacity}}"
            min="0"
            max="1"
            step="0.01">
            <input type="range" min="0" max="1" step="0.01" />
            <input type="number" min="0" max="1" step="0.01" />
        </range-picker>
    </div>
</div>
